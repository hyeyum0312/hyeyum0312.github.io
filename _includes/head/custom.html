<!-- start custom head snippets -->

<!-- 탭 아이콘(픽셀아트 프로필) -->
<link rel="icon" href="{{ '/favicon.ico' | relative_url }}" sizes="any">
<link rel="icon" type="image/svg+xml" href="{{ '/favicon.svg' | relative_url }}">
<link rel="icon" type="image/png" sizes="32x32" href="{{ '/images/favicon-32.png' | relative_url }}">
<link rel="apple-touch-icon" href="{{ '/images/apple-touch-icon.png' | relative_url }}">

<!-- Pretendard 웹폰트 -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">

<!-- 이력서·포트폴리오·About 전용 스타일 — 빌드 시각을 붙여 배포 직후 예전 CSS가 캐시에 남지 않게 한다 -->
{% if page.layout == "resume" or page.layout == "portfolio" or page.layout == "about" %}
<link rel="stylesheet" href="{{ '/assets/css/cv.css' | relative_url }}?v={{ site.time | date: '%s' }}">
{% endif %}

<!-- 이력서·포트폴리오의 영문 라벨용 고정폭 글꼴 -->
{% if page.layout == "resume" or page.layout == "portfolio" %}
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700;800&display=swap">
{% endif %}

<!-- GoatCounter 방문자 분석 -->
{% unless jekyll.environment == "development" %}
<script data-goatcounter="https://hyeyum0312.goatcounter.com/count"
        async src="//gc.zgo.at/count.js"></script>
{% endunless %}

<!-- end custom head snippets -->
