intro:
  - "버스·지하철 서비스는 기획서 없이 동작 기준을 직접 정의해 구현하고, 현장 테스트로 화면의 예상 시각을 실제 도착 시각과 비교하며 정확도를 개선했습니다. 가족 캘린더 서비스는 지인들을 초대해 함께 사용하며 QA에서 발견하지 못한 문제와 사용성 개선점을 찾아 반영했습니다."
  - "정상 동작에서 그치지 않고 데이터가 늦거나 없을 때, 앱이 종료되거나 일정이 삭제됐을 때까지 고려하며, iOS·Android 실기기에서 직접 재현해 확인합니다."
  - "설계부터 구현까지 맡아 반복되는 판단을 공통 구조로 모으고, 요청 공유와 캐시 정책까지 고려해 유지보수하기 좋은 구조를 만듭니다. 정책과 예외 조건은 문서로 남겨 AI 협업과 후속 작업의 판단 기준으로 씁니다."

