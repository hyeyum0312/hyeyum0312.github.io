# 포트폴리오 — 협업 방식. chat은 실제 대화를 옮긴 예시 카드
collaboration:
  intro: "문제를 혼자 해결하기보다, **함께 정의하고 해결 방향을 만들어가는 과정**을 중요하게 생각합니다."
  items:
    - with: "디자이너 · Designer"
      title: "화면 · UI 흐름 중심으로 공유"
      desc: "Figma 코멘트로 **인터랙션과 예외 케이스**를 짚으며 화면 흐름을 함께 맞춥니다."
      meta: "FIGMA · 디자인 리뷰 코멘트"
      chat:
        app: "Figma"
        channel: "Comment"
        to: "디자이너"
        topic: "디자인 리뷰"
        message: "담당자를 선택하고 해제할 수 있는 방법이 없어 보이는데 괜찮을까요?"
        note: "여기 '없음' 선택이 빠져있는데 — 캘린더 기본 설정엔 있어요."
    - with: "백엔드 · Backend"
      title: "공통 데이터 규격을 먼저 제안"
      desc: "알림 처리를 **공통 FCM payload 규격**으로 맞추자고 제안하며, 확장 가능한 구조를 함께 정의합니다."
      meta: "SLACK · FCM payload 규격 제안"
      chat:
        app: "Slack"
        channel: "Thread"
        to: "백엔드"
        topic: "알림 규격"
        message: "현재 공지사항은 `{ \"type\": \"notice\", \"id\": \"123\" }` 형태로 처리하고 있는데, 다른 알림도 **FCM data payload 스펙을 동일한 규격으로** 맞춰두면 좋을 것 같습니다!"
        note: "route를 직접 내려주는 방식보다 type 기반으로 처리하는 쪽이 확장성 면에서 나을 것 같아요. type값을 확인해 랜딩페이지로 이동시키는 방향은 어떨까요?"
        chips: [notice, schedule, todo, remind, image_extract, inquiry, invite]
    - with: "백엔드 · Backend"
      title: "Payload · Response · 재현 경로 기반"
      desc: "API 스펙과 필터, 응답 형태를 **구체적인 근거와 재현 경로**로 공유해 빠르게 합의합니다."
      meta: "API 스펙 · 카테고리 필터 협의"
      chat:
        app: "Slack"
        channel: "Thread"
        to: "백엔드"
        topic: "API 협의"
        message: "월별 일정 조회 API에 **카테고리 필터** 파라미터를 추가할 수 있을까요?"
        note: "필터로 조회할 때 선택한 카테고리도 함께 조회되도록 — 기존 담당자 필터와 같은 패턴으로요."
  closing: "디자이너 · 백엔드 등 함께 일하는 동료와 **의사결정 배경을 공유**하며, 공통의 이해를 만드는 것을 중요하게 생각합니다."

# 포트폴리오 — 회고
retrospective:
  intro: "여러 서비스를 거치며 특정 기술보다 오래 남은 건 **일하는 방식**이었습니다. 앞으로는 이 방식을 팀의 기준으로 넓히려고 합니다."
  items:
    - title: "확인한 것과 추정을 구분하기"
      subtitle: "EVIDENCE FIRST"
      desc: "도착 기록 7건, 재현 테스트의 7회 → 1회처럼 **확인한 범위만큼만 말하고** 나머지는 추정으로 남겼습니다. 결과를 부풀리지 않아야 다음 판단도 흔들리지 않는다는 걸 배웠습니다."
      tags: [현장 검증, 근거 기록]
    - title: "정상 흐름보다 예외부터"
      subtitle: "EDGE CASES FIRST"
      desc: "데이터가 늦거나 없을 때, 앱이 종료되거나 일정이 삭제됐을 때를 **먼저 묻는 습관**이 생겼습니다. 다음 기능에서는 설계 단계부터 이 질문을 체크리스트로 두려고 합니다."
      tags: [예외 우선, 설계 체크리스트]
    - title: "혼자 아는 기준을 팀의 기준으로"
      subtitle: "NEXT: SHARED STANDARDS"
      desc: "QA 인력이 없던 환경에서 QA 시트 · 회귀 테스트 · 정책 문서를 직접 만들었습니다. 앞으로는 핵심 도메인을 처음부터 맡아, 이런 기준을 **팀이 함께 쓰는 문서와 테스트**로 넓히고 싶습니다."
      tags: [정책 문서, 회귀 테스트, 팀 기준]
  closing: "기능 하나를 끝까지 책임지는 데서 나아가, **팀이 같은 기준으로 판단하고 검증할 수 있는 환경**을 만드는 개발자로 성장하고 싶습니다."
