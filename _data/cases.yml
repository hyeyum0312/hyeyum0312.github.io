      - { name: "수정 · 삭제", value: "**엄마만** 가능" }
      - { name: "알림 대상", value: "엄마 · 아빠, 그 외 구성원 제외 (서버에서 판정)" }
      - { name: "나만 보기", value: "등록한 사람 외에는 **일정 주인도 볼 수 없음**" }
  flow:
