# 포트폴리오 케이스 스터디 — project는 projects.yml의 id
# 기간·인원·기술 스택은 프로젝트에서 읽으므로 여기에 다시 적지 않는다
# "TODO:"로 시작하는 값은 화면에 출력하지 않는다. draft: true인 케이스는 통째로 숨긴다
# posts에는 내용을 확인한 블로그 글만 넣는다
# role은 이 케이스에서 직접 맡은 범위, verified는 결과를 확인한 방법 (없으면 표시하지 않음)

- id: transit-subway-baseline
  project: transit
  # 정보 박스에 보여줄 이 케이스 관련 기술 (없으면 프로젝트 전체 스택)
  stack: [React, TypeScript, TanStack Query]
  # 재직 중인 회사 화면 — 공개 여부 확인 전까지 로컬 PDF(private.yml 있음)에서만 표시
  private_screens: true
  title: "지하철 시간표 기준 + 실시간 보정 구조"
  role: "단독 FE — 현장 조사 · 동작 기준 · 구현 · 테스트 · 인수인계"
  summary: "실시간 정보가 누락될 때마다 표시 열차와 시각이 바뀌던 지하철 안내를, 시간표를 기준으로 두고 실시간 정보로 보정하는 구조로 바꿨습니다."
  keywords: [실시간 데이터, 직접 탑승 조사, 모델 · UI 분리]
  problem:
    - "실시간 데이터를 기준으로 화면을 그리고 누락된 부분을 시간표로 채우는 방식이라, 실시간 응답에서 열차 정보가 누락됐다가 다시 들어오기를 반복하면 표시되는 열차와 시각이 갑자기 바뀌었습니다."
    - "응답에서 특정 열차가 보이지 않을 때도 있었지만, 그것만으로 열차가 운행을 멈췄다고 판단할 수는 없었습니다."
    - "한 파일에 데이터 조회 · 처리 · 화면 상태 · UI가 함께 있어, 새로 알게 된 사례를 반영할 때마다 변경 범위를 파악하기 어려웠습니다."
  solution:
    - "직접 탑승하며 데이터를 대조하고, 확인한 사실과 추측을 구분해 기록했습니다."
    - "네이버 지도 · 카카오맵의 화면 변화를 비교하고 백엔드 개발자와 논의해, 시간표를 기준으로 두고 실시간 정보로 보정하는 방식으로 바꿨습니다."
    - "데이터를 해석해 화면 값과 상태를 만드는 모델과, 그 결과를 표현하는 UI의 책임을 나눴습니다."
    - "늦은 응답 · 관측 정보 만료 · 경로 전환 · 알림 등록 실패 등 상태 경계의 회귀 시나리오를 정하고, AI로 작성한 테스트의 기대값을 서비스 정책과 직접 대조해 수정했습니다."
  before:
    note: "실시간 기준"
    items:
      - "실시간 데이터로 화면을 그리고 누락된 부분은 시간표로 채움"
      - "실시간 정보가 누락되면 **표시 열차 · 시각이 갑자기 바뀜**"
      - "조회 · 처리 · 화면 상태 · UI가 한 파일에 섞임"
    verdict: "안내가 일관되지 않고 변경 범위 파악이 어려움"
  after:
    note: "시간표 기준 + 실시간 보정"
    items:
      - "시간표가 **기본 안내**, 실시간 정보는 있을 때 **보정**"
      - "실시간 정보가 잠깐 누락돼도 기본 안내 유지"
      - "모델(데이터 해석)과 UI(표현) 분리"
    verdict: "안내가 안정되고, 판단 변경이 화면 전체로 번지지 않음"
  design_points:
    - "응답에서 찾지 못한 열차를 운행 종료와 같은 상태로 다루지 않음"
    - "2호선 뚝섬 · 성수 · 구의의 실제 시간표 스냅샷을 테스트 응답으로 재생해, 내선 · 외선 방향 판정과 반대 방향 열차 제외를 검증"
    - "데이터 처리의 변경이 화면 전체 수정으로 이어지지 않도록 모델과 UI 사이에 경계를 둠"
    - "확인한 사실 · 현재 정책 · 제안을 문서로 구분해, 다음 작업자가 현재 기준을 찾을 수 있게 함"
  result:
    - "실시간 정보가 잠깐 누락돼도 보던 열차와 시각이 유지되도록 화면 안정화"
    - "2호선 도착 기록 7건을 비교해, 먼 열차의 공공 API 예상이 실제보다 2~5분 이른 사례를 확인하고 표시 기준을 직접 조정"
    - "조정 후 확인한 열차에서 실제 도착에 더 가까운 안내 (소규모 기록이라 전체 노선 정확도로 일반화하지 않음)"
    - "RN 작업자가 현재 동작을 비교하며 작업할 수 있도록 정책 · 인수인계 문서 정리"
  verified: "직접 탑승 · 도착 기록 비교 · Vitest 회귀 테스트 1,500여 개(169개 파일) · iOS / Android 실기기 확인"
  learned:
    - "같은 데이터라도 무엇을 기준으로 두고 무엇으로 보정하느냐에 따라 화면의 안정감이 달라진다는 것을 배웠습니다."
  screens:
    - src: "/images/private/subway-1-timetable.jpg"
      alt: "시간표 기준 열차 목록 — 지나간 열차, 출발, 남은 시간"
      caption: "시간표 기준 목록 — 지나간 열차 · 출발 · 남은 시간"
    - src: "/images/private/subway-2-select.jpg"
      alt: "열차 선택 시트 — 실시간 열차 위치와 지나간 열차"
      caption: "열차 선택 — 실시간 위치로 보정"
    - src: "/images/private/subway-3-selected.jpg"
      alt: "선택한 열차 기준 경로 안내"
      caption: "선택한 열차 기준으로 안내"
    - src: "/images/private/transit-subway-route.jpg"
      alt: "시간표 16:40 열차가 실시간 16:43 곧 도착으로 보정된 화면"
      caption: "시간표 16:40 → 실시간 16:43 곧 도착"
  posts: [/12th/, /16th/, /13th/]

- id: transit-arrival-policy
  project: transit
  # 대표 케이스 표·구조·결과를 채우기 전까지 숨김
  draft: true
  # 정보 박스에 보여줄 이 케이스 관련 기술 (없으면 프로젝트 전체 스택)
  stack: [React, TypeScript, TanStack Query]
  # 재직 중인 회사 화면 — 공개 여부 확인 전까지 로컬 PDF(private.yml 있음)에서만 표시
  private_screens: true
  title: "지역별 버스 도착 정책 정규화"
  summary: "지역마다 다르게 오는 버스 API 상태 응답을 하나의 기준으로 정리하고, 서비스 정책으로 확정했습니다."
  keywords: [정책 설계, 상태 정규화, 기획 협업]
  screen:
    src: "/images/private/transit-bus-arrival.jpg"
    alt: "버스 도착 정보 목록 — 남은 시간, 몇 번째 전, 곧 도착, 운행종료 표시"
    caption: "정규화한 도착 표시 — 남은 시간 · N번째 전 · 곧 도착 · 운행종료"
  problem:
    - "외주 개발이 끝난 버스·지하철 기능을 인수했을 때, 예외·에러·캐시 처리가 갖춰지지 않았고 화면에 표시되는 시간도 실제 운행과 맞지 않았습니다."
    - "지역마다 버스 도착 API가 상태를 표현하는 방식이 달라, 같은 상황도 지역에 따라 화면 문구와 알림 처리가 달라질 수 있었습니다."
    - "인수한 도착 정보 화면은 실시간 데이터가 누락됐을 때의 처리가 없어, 표시되는 도착 시간이 뒤로 갔다가 다시 앞으로 가는 등 오락가락했습니다."
  solution:
    - "지역별 응답을 \"응답 상황 → 화면 표시 문구 → 알림 후보 처리\" 세 단계 기준으로 통일했습니다."
    - "개발 중 정책을 먼저 정의하고, 구현 결과와 함께 기획 책임자에게 제안했습니다."
  # 대표 케이스 4~5개 — 회사 내부 문구·규칙을 그대로 옮기지 말고 일반화해서 적는다
  policy_table:
    - situation: "TODO: 대표 케이스 1 응답 상황"
      display: "TODO: 화면 표시"
      alert: "TODO: 알림 후보 처리"
    - situation: "TODO: 대표 케이스 2 응답 상황"
      display: "TODO: 화면 표시"
      alert: "TODO: 알림 후보 처리"
    - situation: "TODO: 대표 케이스 3 응답 상황"
      display: "TODO: 화면 표시"
      alert: "TODO: 알림 후보 처리"
    - situation: "TODO: 대표 케이스 4 응답 상황"
      display: "TODO: 화면 표시"
      alert: "TODO: 알림 후보 처리"
  design_points:
    - "응답 해석과 화면 표시, 알림 처리를 단계별로 나눠, 지역이 늘어나도 응답 해석만 추가하면 되게 했습니다."
    - "응답이 비었거나 조회에 실패한 경우를 \"도착\"이나 \"운행 종료\" 같은 확정 상태로 바꾸지 않고, 정보가 부족한 상태로 따로 표현했습니다."
    - "TODO: 정규화 구조의 구체적인 설계(타입·매핑 위치 등)"
  result:
    - "제안한 기준이 서비스 정책으로 확정됐습니다."
    - "TODO: 확정 이후 변화(문의 감소, 지역 추가 시 작업량 등 근거가 있는 결과만)"
  learned:
    - "데이터가 부족할 때 화면이 무엇을 말해야 하는지 먼저 정해야 구현도 흔들리지 않았습니다. 잘못된 확정보다는 늦은 확정이 낫다는 기준을 정책으로 남겼습니다."
  posts: [/14th/, /15th/]

- id: moa-back-press
  project: moa
  # 직접 맡은 작업이 아니라 숨김 — 삭제하지 않고 보관
  draft: true
  # 정보 박스에 보여줄 이 케이스 관련 기술 (없으면 프로젝트 전체 스택)
  stack: [React, TypeScript, Zustand, Flutter WebView]
  title: "뒤로가기 처리 구조 개선"
  summary: "Dialog, Bottom Sheet, Overlay가 겹쳐 열린 화면에서도 가장 위 레이어부터 순서대로 닫히도록, 뒤로가기를 우선순위 기반 구조 하나로 정리했습니다."
  keywords: [useBackPress, Zustand, Flutter WebView]
  # 케이스 첫 장 오른쪽에 휴대폰 프레임으로 보여줄 실제 화면 (개인정보가 보이지 않는 화면만)
  screen:
    src: "/images/portfolio/moa-layered-sheet.jpg"
    alt: "MOA 일정 추가 화면 위에 카테고리 선택 시트가 겹쳐 열린 화면"
    caption: "일정 추가 위에 카테고리 시트가 겹친 상태"
  problem:
    - "Android WebView 환경에서 Dialog, Bottom Sheet, Overlay가 여러 겹으로 열려 있을 때 뒤로가기 동작을 예측하기 어려웠습니다."
    - "가장 위 레이어만 닫혀야 했지만, 상황에 따라 하위 Sheet가 먼저 닫히거나 앱 종료 토스트가 노출되는 문제가 반복됐습니다."
    - "`MainLayout` 안에서 레이어별 조건문으로 처리하고 있어, 레이어가 추가될 때마다 분기 코드가 늘어나는 구조였습니다."
  solution:
    - "뒤로가기 이벤트의 진입점을 `window.handleBackPress` 하나로 통일하고, 전역 `backPressStore`가 우선순위 기반으로 handler를 관리하도록 바꿨습니다."
    - "각 레이어는 `useBackPress` 훅으로 자신의 우선순위와 handler만 등록하고, 뒤로가기가 발생하면 가장 높은 우선순위의 handler만 실행됩니다."
  # 슬라이드 하단 카드 — context(상황), before, after
  context:
    title: "상황"
    note: "레이어 우선순위 예시"
    rows:
      - { name: "TimePicker", value: "priority 1000" }
      - { name: "FormSheet", value: "priority 600" }
      - { name: "DetailSheet", value: "priority 500" }
    steps:
      - "뒤로가기 1회 → TimePicker 닫힘"
      - "뒤로가기 2회 → FormSheet 닫힘"
      - "뒤로가기 3회 → DetailSheet 닫힘"
      - "뒤로가기 4회 → Native 앱 종료 처리"
  before:
    note: "조건문 분기 처리"
    code: |
      MainLayout
       ├─ if Dialog 열림
       ├─ if Sheet 열림
       ├─ if Overlay 열림
       ├─ if Popup 열림
       └─ else 앱 종료 처리
    verdict: "조건문 증가 · 레이어 충돌 · 핫픽스 누적"
  after:
    note: "우선순위 기반 처리"
    items:
      - "각 레이어: `useBackPress(priority, handler)`"
      - "`backPressStore`: priority 정렬 → **가장 높은 우선순위 handler 하나만 실행**"
    verdict: "레이어 추가 시 우선순위만 지정"
  # 처리 흐름 — 포트폴리오에서 단계 다이어그램으로 그린다
  flow:
    - "Android Back Button"
    - "Flutter 감지"
    - "`window.handleBackPress()` — 단일 진입점"
    - "`backPressStore.handleBackPress()`"
    - "우선순위 정렬"
    - "가장 높은 우선순위 handler 실행 → `true`면 이벤트 소비, 모두 `false`면 Native로 위임"
  design_points:
    - "Android 뒤로가기 이벤트를 단일 진입점으로 통합"
    - "Dialog · Sheet · Overlay 등 레이어별 우선순위 체계 정의"
    - "`enabled` 값에 따라 handler 등록 · 해제 자동화"
    - "가장 높은 우선순위 handler가 `true`를 반환하면 이벤트를 소비하고, 모든 handler가 `false`일 때만 Native로 위임"
  result:
    - "중첩 레이어 환경에서 가장 위 레이어부터 순서대로 닫히도록 개선"
    - "레이어를 추가할 때 우선순위만 지정하면 뒤로가기 동작이 적용되는 구조"
    - "`MainLayout` 조건문 기반 핫픽스 구조를 제거해 유지보수성 개선"
    - "엉뚱한 레이어가 닫히거나 앱 종료 토스트가 노출되던 문제가 더 이상 재현되지 않음"
  verified: "iOS / Android 실기기 테스트"
  learned:
    - "복잡한 상태 문제는 개별 버그를 계속 수정하기보다, 이벤트 처리 모델 자체를 단순화하는 방식이 더 효과적이라는 점을 경험했습니다."
  posts: []

- id: moa-family-alert
  project: moa
  stack: [React, TypeScript, Flutter WebView, FCM]
  title: "가족 권한 Hook과 알림 처리"
  role: "권한 Hook · Flutter FCM 수신 · 알림 화면 이동 구현, payload · 컬러 초기값 백엔드와 협의"
  summary: "일정 생성자와 스케줄 오너가 다를 수 있는 가족 캘린더에서, 역할 판정을 권한 Hook 하나로 모으고 알림을 누르면 앱 상태와 관계없이 해당 화면으로 이동하도록 처리했습니다."
