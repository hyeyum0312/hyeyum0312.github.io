    - "나만 보기 일정은 일정 주인도 볼 수 없어야 했고, 알림마다 이동할 화면도 달랐습니다."
  solution:
    - "서버가 내려준 오너 여부 · 수정 가능 여부 같은 조건값을 조합해 프론트에서 쓸 역할(오너 · 담당자 등)로 분류하고, 역할별 조회 · 수정 · 삭제 판정을 권한 Hook으로 만들었습니다."
    - "FCM payload는 `type` · `id` · 날짜만 받기로 백엔드와 정하고, 이동할 화면은 앱이 type별로 판단했습니다."
    - "Flutter에서 앱 상태별 알림을 받아 WebView로 전달하고, 로그아웃 상태면 로그인 후 원래 화면으로 이동시켰습니다."
    - "구성원별 컬러 타입과 초기값을 백엔드와 정하고, 원하는 구성원의 일정만 보는 필터를 만들었습니다."
  context:
    title: "예시"
    note: "엄마가 아빠의 자녀 픽업 일정을 대신 등록"
    rows:
