    - "앱 상태 확인 — 켜짐 · 백그라운드 · 종료"
    - "`type` · `id` · 날짜를 WebView로 전달"
    - "로그인 확인 — 로그아웃이면 목적지 보관 후 로그인"
    - "type별 화면으로 이동 — 일정이 삭제됐으면 그 날짜의 바텀시트"
  design_points:
    - "서버 조건값은 Hook에서 역할로 한 번만 분류하고, 화면은 역할로만 판정"
    - "알림 작업 중 '스케줄 오너' 역할이 새로 생기자, 백엔드와 기준을 맞추고 Hook에 역할을 추가해 반영"
    - "알림 수신 대상은 서버가, 알림을 누른 뒤의 화면 이동은 앱이 맡도록 역할을 나눔"
    - "로그인이 필요하면 이동 목적지를 보관했다가 로그인 완료 후 이어서 이동"
    - "알림 후 일정이 삭제됐으면 빈 화면 대신 payload 날짜의 바텀시트를 띄움"
    - "구성원별 컬러를 타입 값으로 관리해, 오너가 바꾼 컬러가 가족 전체 화면에 같은 기준으로 반영"
  result:
    - "앱 상태나 로그인 여부와 관계없이 알림에서 해당 일정 · 화면으로 이동"
    - "일정을 대신 등록한 경우에도 등록한 사람 · 일정 주인 · 그 외 구성원의 조회와 수정 권한이 화면마다 같은 기준으로 동작"
  verified: "iOS / Android 실기기 테스트"
  learned:
