strengths:
  - title: "문제 정의와 정책 설계"
    desc: "기획서 없이 디자인만 있는 상황에서도 직접 사용해 보고 데이터를 확인하며 동작 기준을 정해왔습니다. 정보가 없거나 예상과 다를 때 화면이 어떻게 동작해야 하는지 정책으로 정리하고, 결정한 내용은 문서로 남겨 팀이 같은 기준으로 작업할 수 있게 합니다."
  - title: "운영 환경에서 발생하는 문제 해결"
    desc: "인증 만료, 네트워크 단절, 앱 재실행, WebView 환경 이슈 등 실제 서비스 운영 과정의 예외 상황을 분석하고, 사용자의 작업 흐름이 중단되지 않도록 복구 구조를 설계하고 개선해왔습니다."
  - title: "반복되는 문제를 공통 구조로 개선"
    desc: "기능별로 분산된 권한 정책, 상태 관리, 처리 흐름을 공통 구조로 정리해 일관성과 유지보수성을 높입니다. 문제를 개별적으로 해결하기보다 재사용 가능한 구조로 개선하는 방식을 선호합니다."
  - title: "원활한 협업과 커뮤니케이션"
    desc: "기획자와는 사용자 흐름과 정책 관점에서 문제를 정의하고, 디자이너와는 사용자 경험을 고려해 구현 방향을 논의합니다. 백엔드 개발자와는 API 명세, 데이터 구조, 예외 상황을 함께 검토하고, 운영 이슈가 생기면 재현 과정과 원인을 공유해 빠르게 해결합니다."
  - title: "빠른 학습과 적용"
    desc: "Flutter WebView 기반 하이브리드 앱 개발, 의료 AI 서비스 운영, 모바일 환경 이슈 대응 등 경험이 없던 영역도 필요한 수준까지 빠르게 학습해 서비스에 적용해왔습니다."

